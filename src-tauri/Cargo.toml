[package]
name = "fokusdeck"
version = "0.4.0"
description = "Fokussiert lernen mit Timer, Karteikarten und Always-on-top-Overlay"
authors = ["FokusDeck Contributors"]
edition = "2021"

[lib]
name = "fokusdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
walkdir = "2"
