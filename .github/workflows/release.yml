name: Release FokusDeck

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: fokusdeck-release
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = if ((Get-Content src-tauri/Cargo.toml -Raw) -match '(?m)^version = "([^"]+)"') { $Matches[1] } else { '' }
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version v$packageVersion"
          }
      - name: Verify signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is not configured.'
          }
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "FokusDeck v__VERSION__"
          releaseBody: "Neue FokusDeck-Version mit signiertem In-App-Update. Karten und Einstellungen bleiben beim Aktualisieren erhalten."
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
      - name: Smoke-test native application startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "src-tauri/target/release/fokusdeck.exe" -PassThru
          if ($app.WaitForExit(5000)) {
            throw "FokusDeck exited during its startup smoke test. Exit code: $($app.ExitCode)"
          }
          Stop-Process -Id $app.Id
      - name: Validate and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if (-not $release.draft) { throw 'Release must remain a draft during validation.' }

          $assetNames = @($release.assets | ForEach-Object name)
          $installers = @($release.assets | Where-Object { $_.name -match '\.exe$' })
          $signatures = @($release.assets | Where-Object { $_.name -match '\.exe\.sig$' })
          if ($installers.Count -ne 1 -or $signatures.Count -ne 1 -or $assetNames -notcontains 'latest.json') {
            throw "Incomplete updater assets: $($assetNames -join ', ')"
          }

          New-Item -ItemType Directory -Path release-verify | Out-Null
          gh release download "v$env:APP_VERSION" --pattern latest.json --dir release-verify
          $latest = Get-Content release-verify/latest.json -Raw | ConvertFrom-Json
          $installer = $installers[0]
          $signature = $signatures[0]
          $installerPath = "src-tauri/target/release/bundle/nsis/$($installer.name)"
          $signaturePath = "src-tauri/target/release/bundle/nsis/$($signature.name)"
          $localSignature = (Get-Content $signaturePath -Raw).Trim()
          $localInstallerDigest = "sha256:$((Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant())"
          $localSignatureDigest = "sha256:$((Get-FileHash $signaturePath -Algorithm SHA256).Hash.ToLowerInvariant())"

          if ($latest.version -ne $env:APP_VERSION) { throw 'latest.json has the wrong version.' }
          if (-not $installer.digest -or $installer.digest.ToLowerInvariant() -ne $localInstallerDigest) { throw 'GitHub stored a different installer payload.' }
          if (-not $signature.digest -or $signature.digest.ToLowerInvariant() -ne $localSignatureDigest) { throw 'GitHub stored a different signature payload.' }

          foreach ($target in @('windows-x86_64', 'windows-x86_64-nsis')) {
            $platform = $latest.platforms.$target
            if (-not $platform) { throw "latest.json is missing $target." }
            if ($platform.signature.Trim() -ne $localSignature) { throw "latest.json has the wrong updater signature for $target." }
            if ($platform.url -ne $installer.url) { throw "latest.json points to the wrong installer asset for $target." }
          }

          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F draft=false
